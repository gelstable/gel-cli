changelog:
  exclude:
    labels:
      - internal
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking
    - title: New features
      labels:
        - feature
    - title: Bug fixes
      labels:
        - fix
    - title: Other changes
      labels:
        - '*'
