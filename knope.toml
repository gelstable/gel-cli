[packages.gel-cli]
versioned_files = ["Cargo.toml", "Cargo.lock"]
changelog = "CHANGELOG.md"

[[workflows]]
name = "prepare-release"
help_text = "Prepare the next release for the checked-out release line"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git add -A"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

[[workflows]]
name = "document-change"
help_text = "Create a change file to be included in the next release"

[[workflows.steps]]
type = "CreateChangeFile"

[github]
owner = "gelstable"
repo = "gel-cli"
