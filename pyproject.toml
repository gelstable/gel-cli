[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gel-release"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1", "pydantic==2.11.9"]

[dependency-groups]
dev = ["pytest==8.4.2", "pyyaml==6.0.2", "ruff==0.13.0", "ty==0.0.1a20"]

[project.scripts]
gel-release = "gel_release.cli:main"

[tool.pytest.ini_options]
testpaths = ["scripts/release/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["gel_release*"]
